# nginx example in front of Laravel (optional).
# Primary office HTTPS terminator is Caddy: deploy/caddy/Caddyfile
# Laravel should remain on 127.0.0.1:8080. Do not expose SQL 1433.

# HTTP is not the office origin. Redirect if you must listen on 80.
server {
    listen 80;
    server_name gbc.office.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gbc.office.local;

    ssl_certificate     C:/Users/Administrator/Documents/GBCDistribution/deploy/caddy/certs/gbc.office.local.pem;
    ssl_certificate_key C:/Users/Administrator/Documents/GBCDistribution/deploy/caddy/certs/gbc.office.local-key.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
