# nginx example in front of Laravel (optional)

server {
    listen 8080;
    server_name YOUR_APP_HOSTNAME localhost;

    root C:/Users/YOUR_USER/Documents/BSC Distribution/backend/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
